<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomoto - food delivery at your door step</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
        }

        /* Header */
        header {
            background-color: red;
            color: white;
            padding: 20px 50px;
            font-size: 30px;
            font-weight: bold;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Navigation */
        header div {
            display: flex;
            gap: 30px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Main */
        main {
            min-height: 75vh;
            text-align: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        main div {
            font-size: 45px;
            font-weight: bold;
            color: red;
            margin-bottom: 20px;
        }

        main p {
            font-size: 20px;
            color: #555;
            max-width: 650px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <header>
        Zomoto
        <div>
            <a href="Home">home</a>
            <a href="About">About</a>
            <a href="Contact">Contact</a>
        </div>
    </header>

    <main>
        <div>
            order food any time and any where
        </div>
        <p>
            Our app is packed with features that enable you to experience food delivery like never before
        </p>
    </main>

    <footer>
        Copyright Zomoto all right reserved
    </footer>

</body>

</html>
