<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStud - Book your travel to world</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #4facfe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        form {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        form::before {
            content: "✈️ TravelStud";
            display: block;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1683d8;
            margin-bottom: 10px;
        }

        form::after {
            content: "Book your travel to the world";
            display: block;
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        div {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: #1683d8;
            box-shadow: 0 0 6px rgba(22, 131, 216, 0.3);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1683d8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0b66ad;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <form action="">

        <div>
            <label for="Name">Name</label>
            <input id="Name" type="text" placeholder="Enter your name">
        </div>

        <div>
            <label for="Age">Age</label>
            <input id="Age" type="number" placeholder="Enter your Age">
        </div>

        <div>
            <label for="Phone">Phone</label>
            <input id="Phone" type="tel" placeholder="Enter your phone">
        </div>

        <div>
            <label for="Email">Email</label>
            <input id="Email" type="email" placeholder="Enter your Email">
        </div>

        <div>
            <label for="Add">Address</label>
            <textarea name="Address" id="Add" placeholder="Enter your address"></textarea>
        </div>

        <div>
            <button type="submit">Book Your Trip</button>
        </div>

    </form>

</body>

</html>
